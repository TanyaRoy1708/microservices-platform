global:
  imageTag: "1.0.0"
  ecrRegistry: ""

# ─── API Gateway ──────────────────────────────────────────────────────────────
apiGateway:
  replicaCount: 2
  port: 8000
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "300m"
  hpa:
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  pdb:
    minAvailable: 1

# ─── User Service ─────────────────────────────────────────────────────────────
userService:
  replicaCount: 2
  port: 5001
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "300m"
  hpa:
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  pdb:
    minAvailable: 1

# ─── Order Service ────────────────────────────────────────────────────────────
orderService:
  replicaCount: 2
  port: 5002
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "300m"
  hpa:
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  pdb:
    minAvailable: 1

# ─── AI Service ───────────────────────────────────────────────────────────────
# AI service has higher resource requirements due to httpx connection pools
# and heavier request payloads (LLM prompt + response handling).
# Conservative HPA: LLM-backed services have higher warmup costs per pod.
aiService:
  replicaCount: 2
  port: 5003
  model: "llama3.2:1b"
  ollamaUrl: ""   # Set at deploy time via --set aiService.ollamaUrl= (Ollama runs on EC2)
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  hpa:
    minReplicas: 1   # Can run with 1 — Ollama is the bottleneck, not this pod
    maxReplicas: 4
    targetCPUUtilizationPercentage: 65
  pdb:
    minAvailable: 1

# ─── Ingress ──────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: "alb"
  host: "api.microservices.internal"